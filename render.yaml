# Déploiement gratuit sur Render (Blueprint) : New → Blueprint → dépôt packio, branche main.
# Guide pas à pas : README, section « Déployer gratuitement : Render + Supabase + cron-job.org ».
#
# Contenu : le site, sur une instance gratuite (région Francfort). La base de
# données et les fichiers sont chez Supabase (gratuit), les tâches automatiques
# chez cron-job.org (gratuit), qui appelle /api/cron/toutes toutes les 10 minutes.
# Les clés secrètes se saisissent dans le tableau de bord Render, jamais ici.

services:
  - type: web
    name: packio
    runtime: node
    plan: free
    region: frankfurt
    # L'offre gratuite n'a pas de commande de pré-déploiement : migrations,
    # données de référence, compte administrateur (lien d'activation dans les
    # journaux de construction) et, si DEMO_DATA vaut 1, données de
    # démonstration sont appliqués ici, avant la construction du site.
    # Dépendances de développement incluses : TypeScript et tsx servent à la
    # construction et à ces scripts.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run db:bootstrap && if [ "$DEMO_DATA" = "1" ]; then npm run db:seed; fi && npm run build
    startCommand: npm start
    healthCheckPath: /connexion
    autoDeployTrigger: commit
    envVars:
      # Adresse publique du site. Si Render attribue une autre adresse (nom déjà
      # pris), corrigez-la ici puis redéployez.
      - key: APP_URL
        value: https://packio.onrender.com
      # Secret à recopier dans cron-job.org (en-tête Authorization: Bearer …).
      - key: CRON_SECRET
        generateValue: true
      # Supabase → Connect → Session pooler (port 5432), mot de passe inclus.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      # Fichiers privés dans Supabase Storage (bucket « packio », non public) :
      # Storage → Settings → S3 (endpoint, région, clés d'accès).
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        value: packio
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Votre adresse e-mail : compte super administrateur créé au premier déploiement.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      # Lecture de secours de Packio Connect (facultatif) : clé Google Gemini
      # gratuite (aistudio.google.com/apikey).
      - key: GEMINI_API_KEY
        sync: false
      # Site de démonstration : comptes de démo et paiements simulés (aucun
      # encaissement). Pour le lancement réel, voir le README (nouvelle base,
      # DEMO_DATA supprimé, BILLING_MODE=whop).
      - key: DEMO_DATA
        value: "1"
      - key: BILLING_MODE
        value: dev
      - key: ALLOW_DEV_BILLING_IN_PRODUCTION
        value: "1"
